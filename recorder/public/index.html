<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مكتبة الصوتيات العربي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: plain list, one line per sound; round buttons on the left of each line */
:root{--bg:#FFFFFF;--ink:#1B2530;--soft:#5E6C7B;--line:#E1E7EE;--blue:#1F6FD1;--rec:#D8452F;--ok:#1E8A5E;--font:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121920;--ink:#EAF0F6;--soft:#9BAABA;--line:#2C3845;--blue:#6AA8F2;--rec:#FF7A63;--ok:#4CC794;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121920;--ink:#EAF0F6;--soft:#9BAABA;--line:#2C3845;--blue:#6AA8F2;--rec:#FF7A63;--ok:#4CC794;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:28px;margin:0}
h2{font-size:20px;margin:0;padding-bottom:4px;border-bottom:2px solid var(--blue)}
.how{margin:0;color:var(--soft);font-size:15px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;max-width:min(92vw,520px);padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#msg:empty{display:none}
#msg.ok{background:var(--ok);color:#fff}
#msg.rec{background:var(--rec);color:#fff}
.sec{display:flex;flex-direction:column}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;padding:10px 0;border-bottom:1px solid var(--line)}
.line .tx{flex:1 1 9em;min-width:9em;overflow-wrap:anywhere}
.ctl{flex:none}
.lab{flex:none}
.line .tx.big{flex:1 1 5em;min-width:0}
.big{font-size:28px;font-weight:700;line-height:1.4}
.lab{font-size:13px;color:var(--soft);min-width:44px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.35em;margin-inline-start:auto}
.pair{border-bottom:1px solid var(--line)}
.pair .line{border-bottom:0;padding:.3em 0}
.line.syl{flex-direction:column;align-items:stretch;gap:.3em}
.line.syl .tx{flex:none;min-width:0;width:100%}
.line.syl .ctl{margin:0;width:100%;flex-direction:column;align-items:stretch}
.btns{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:.35em}
.line.syl .btns{width:100%}
.btns .del{order:-1;margin-right:auto}
.notes{display:flex;flex-wrap:wrap;align-items:center;gap:.2em .6em}
.tag{flex-basis:100%;font-size:.75em;line-height:1.3;color:var(--rec);font-weight:700}
.tx .tag{display:block;margin-top:.2em}
.ib{width:40px;height:40px;border-radius:50%;border:2px solid var(--blue);background:none;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib.rec{border-color:var(--rec);color:var(--rec)}
.ib.live{background:var(--rec);color:#fff}
.ib.mine{border-color:var(--ok);color:var(--ok)}
.ib.on{background:color-mix(in srgb,var(--blue) 18%,transparent)}
.ib.gap{visibility:hidden}
.ib input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.x{border:0;background:none;color:var(--soft);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
input[type=text],select{font:inherit;font-size:20px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--bg);color:var(--ink);min-width:0}
.split{font-weight:700;width:100%;box-sizing:border-box;direction:rtl;text-align:left;font-size:18px}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add input{flex:1;min-width:160px}
.btn{font:inherit;font-size:17px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:4px 18px;cursor:pointer}
.empty{color:var(--soft);font-size:15px;padding:8px 0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#gate[hidden]{display:none!important}
body:not(.in) main>section:not(#gate),body:not(.in) main>.how,body:not(.in) main>.filters{display:none!important}
</style>
</head><body style="margin:0">
<main>
 <div style="display:flex;gap:14px;font-size:16px"><b>مكتبة العربي</b><a href="en.html" style="color:var(--blue)">مكتبة الإنجليزي</a><a href="pics.html" style="color:var(--blue)">مكتبة الصور</a></div>
 <h1>مكتبة الصوتيات</h1>
 <p class="how">اضغط على المايك واستمر في الضغط وأنت تتكلم، وأفلت الزر عند الانتهاء. زر السهم لرفع تسجيل جاهز من الجهاز. الأخضر يعني أنه تم تسجيله. للمقاطع: قل كل المقاطع بالترتيب مع وقفة بينها، وأنا أقطعها.</p>
 <div id="msg" role="status"></div>
 <section class="sec" id="gate"><h2>كلمة السر</h2><div class="add"><input type="text" id="pw" placeholder="كلمة السر" autocomplete="off"><button class="btn" id="pwbtn">دخول</button></div><p class="how" id="pwnote"></p></section>
 <section class="sec" id="needed"></section>
 <section class="sec">
  <h2>إضافة جديد</h2>
  <div class="add"><select id="kind"><option value="word">كلمة</option><option value="letter">حرف</option><option value="question">سؤال</option><option value="reading">قراءة</option><option value="other">غير ذلك</option></select>
  <input type="text" id="newtext" placeholder="اكتب النص هنا" autocomplete="off"><input type="text" id="newsyl" placeholder="المقاطع، افصل بينها بشرطة -" autocomplete="off"><button class="btn" id="addbtn">إضافة</button></div>
 </section>
 <section class="sec" id="shared"></section>
 <section class="sec" id="words"></section>
 <section class="sec" id="prompts"></section>
 <section class="sec" id="done"></section>
 <section class="sec"><button class="btn" id="backup" style="align-self:flex-start">نزّل كل التسجيلات (نسخة احتياطية)</button></section>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const mk=(t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e;};
const ICON={
 play:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
 mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
 del:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 16V5"/><path d="M7 9l5-5 5 5"/><path d="M5 19h14"/></svg>'
};
const MAXMS=30000;
let items={words:[],prompts:[]}, recs={}, splits={}, customs=[], needed=[], cur=null, micBlocked=false, live=false, PW='';
try{ PW=localStorage.getItem('pw')||''; }catch(e){}
const idOf=k=>k.replace(/[\/:]/g,'~');
const MARKS=[['fatha','\u064E','فتحة'],['damma','\u064F','ضمة'],['kasra','\u0650','كسرة'],['sukoon','\u0652','سكون']];
const SHARED=[['arabic/shared/p-start.mp3','في أول الكلمة'],['arabic/shared/p-mid.mp3','في وسط الكلمة'],['arabic/shared/p-end-joined.mp3','في آخر الكلمة متصل'],['arabic/shared/p-end-alone.mp3','في آخر الكلمة منفصل'],
 ['arabic/shared/h-fatha.mp3','فَتْحَة'],['arabic/shared/h-damma.mp3','ضَمَّة'],['arabic/shared/h-kasra.mp3','كَسْرَة'],['arabic/shared/h-sukoon.mp3','سُكُون']];
const letterDone=c=>!!recs[idOf('c/'+c.id)]&&!!recs[idOf('cl/'+c.id)];
const same=(a,b)=>JSON.stringify(a||[])===JSON.stringify(b||[]);
const stale=(key,parts)=>{ const r=recs[idOf(key)]; return !!(r&&parts&&r.parts&&!same(r.parts,parts)); };   // recorded for an older split
const sylList=t=>t.split(/[-–—،,]/).map(x=>x.trim()).filter(Boolean);
const hex=t=>[...t].map(c=>c.codePointAt(0).toString(16)).join('-');
let mt;
const say=(m,k)=>{ const e=$('#msg'); e.textContent=m||''; e.className=k||''; clearTimeout(mt); if(m&&k==='ok') mt=setTimeout(()=>say(''),3500); };
async function api(method,path,body,raw){
 const r=await fetch(path,{method,headers:{'x-pw':PW,...(raw?{'content-type':raw}:body?{'content-type':'application/json'}:{})},body:raw?body:(body?JSON.stringify(body):undefined)});
 if(r.status===401){ gate('كلمة السر غير صحيحة أو انتهت، ادخلي من جديد'); throw new Error('auth'); }
 return r;
}
function playUrl(u,btn){ if(cur) cur.pause(); const a=new Audio(u); cur=a; btn&&btn.classList.add('on'); const done=()=>btn&&btn.classList.remove('on'); a.onended=done; a.onerror=()=>{done();say('تعذر تشغيل الصوت');}; a.play().catch(done); }
async function playMine(id,btn){ try{ const r=await api('GET','/api/audio/'+id); if(!r.ok) return say('لا يوجد تسجيل'); playUrl(URL.createObjectURL(await r.blob()),btn); }catch(e){say('تعذر تشغيل التسجيل');} }
async function save(slot,blob){
 if(blob.size<1500) return say('التسجيل قصير جدا. اضغط على المايك واستمر ثم تكلم، وأفلت بعد ما تخلص');
 say('جاري الحفظ...');
 if(slot.parts&&stale(slot.key,slot.parts)){ const o=recs[idOf(slot.key)]; try{ const r0=await api('GET','/api/audio/'+o.id); if(r0.ok) await api('PUT','/api/audio/'+o.id+'~old'+o.ts+'?meta='+encodeURIComponent(JSON.stringify({path:o.path,label:(o.label||'')+' (قديم)',parts:o.parts})),await r0.blob(),o.mime||'audio/webm'); }catch(e){} }
 const id=idOf(slot.key), meta={path:slot.path,label:slot.label}; if(slot.parts) meta.parts=slot.parts; if(slot.alt&&slot.alt.length) meta.alt=slot.alt;
 try{ const r=await api('PUT','/api/audio/'+id+'?meta='+encodeURIComponent(JSON.stringify(meta)),blob,(blob.type||'audio/webm').split(';')[0]||'audio/webm');
  if(!r.ok) return say('لم يتم الحفظ'); await load(); say('تم الحفظ ✓ اضغط السماعة الخضراء لتسمع تسجيلك','ok'); }catch(e){ if(e.message!=='auth') say('لم يتم الحفظ، تأكد من الإنترنت'); }
}
async function del(slot){ try{ await api('DELETE','/api/audio/'+idOf(slot.key)); await load(); }catch(e){say('تعذر الحذف');} }
function holdMic(slot){
 const el=mk('button','ib rec',ICON.mic); el.title='اضغط واستمر للتسجيل'; el.setAttribute('aria-label','تسجيل'); el.oncontextmenu=e=>e.preventDefault();
 if(micBlocked||!(navigator.mediaDevices&&window.MediaRecorder)){ const l=mk('label','ib rec',ICON.mic); const i=mk('input'); i.type='file'; i.accept='audio/*'; i.onchange=async()=>{ if(i.files[0]) await save(slot,i.files[0]); i.value=''; }; l.append(i); l.title='اختر تسجيلا من الجهاز'; return l; }
 let st=null;
 const end=()=>{ if(st){ const s=st; st=null; if(s.rec&&s.rec.state!=='inactive') s.rec.stop(); else s.cancel=true; } };
 el.onpointerdown=async e=>{ e.preventDefault(); if(st) return; const s={cancel:false,rec:null}; st=s; try{el.setPointerCapture(e.pointerId);}catch(_){}
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(err){ st=null; micBlocked=true; render(); say('لم يسمح المتصفح بالمايك. اسمح له من إعدادات الموقع، أو سجّل بتطبيق التسجيل ثم اضغط زر المايك لاختيار الملف.'); return; }
  if(s.cancel||st!==s){ stream.getTracks().forEach(t=>t.stop()); say('أفلتّ الزر قبل ما يبدأ التسجيل. اضغط واستمر ثم تكلم'); return; }
  const rec=new MediaRecorder(stream), ch=[]; s.rec=rec; live=true; el.classList.add('live'); say('● جاري التسجيل... أفلت الزر عند الانتهاء','rec');
  rec.ondataavailable=ev=>ev.data.size&&ch.push(ev.data);
  rec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); clearTimeout(tm); live=false; el.classList.remove('live'); st=null; await save(slot,new Blob(ch,{type:rec.mimeType||'audio/webm'})); render(); };
  const tm=setTimeout(()=>{ if(rec.state!=='inactive') rec.stop(); },MAXMS); rec.start(); };
 el.onpointerup=end; el.onpointercancel=end; el.onlostpointercapture=end;
 return el;
}
function ctl(slot,existing){
 const w=mk('span','ctl'), b=mk('span','btns'), old=!!slot.parts&&stale(slot.key,slot.parts), has=!!recs[idOf(slot.key)]&&!old;
 const u=mk('label','ib',ICON.up); u.title='رفع ملف صوتي'; const i=mk('input'); i.type='file'; i.accept='audio/*'; i.onchange=async()=>{ if(i.files[0]) await save(slot,i.files[0]); i.value=''; }; u.append(i); b.append(u);
 b.append(holdMic(slot));
 if(has){ const p=mk('button','ib mine',ICON.play); p.title='تسجيلي'; p.onclick=()=>playMine(idOf(slot.key),p); b.append(p);
  const x=mk('button','ib rec',ICON.del); x.title='حذف'; x.setAttribute('aria-label','حذف'); x.onclick=()=>del(slot); x.classList.add('del'); b.append(x); }
 else if(old){ const p=mk('button','ib',ICON.play); p.title='تسجيل قديم لتقسيم آخر'; p.onclick=()=>playMine(idOf(slot.key),p); b.append(p); w.append(mk('span','tag wait','التقسيم اتغيّر، سجّلي المقاطع تاني')); }
 else if(existing){ const p=mk('button','ib',ICON.play); p.title='تسجيلك الحالي'; p.onclick=()=>playUrl(existing,p); b.append(p); }
 else b.append(mk('span','ib gap'));
 w.prepend(b);
 return w;
}
const partsOf=it=>{ const sp=splits[it.id]; if(!sp) return it.parts;
 return sp.map((t,i)=>{ const o=it.parts[i]; return (o&&o.t===t)?o:{t,f:'syl-ar/'+hex(t)+'.mp3'}; }); };
function splitEditor(label,cur,orig,onSave,onReset){
 const tx=mk('span','tx'), inp=mk('input'); inp.type='text'; inp.className='split'; inp.value=cur.join(' - ');
 const commit=async()=>{ const arr=sylList(inp.value);
  if(!arr.length||same(arr,cur)) return;
  if(arr.join('').replace(/\s/g,'')!==label.replace(/[\u064B-\u0652\u0670]/g,'').replace(/\s/g,'')&&arr.join('').replace(/\s/g,'')!==label.replace(/\s/g,'')) say('انتبه: الحروف بعد التقسيم مختلفة عن الكلمة');
  try{ await onSave(arr); await load(); say('تم حفظ التقسيم ✓ قولي لـ Claude: «طبّق التقسيمات» وهتتحدث أماكن المقاطع. التسجيلات القديمة محفوظة','ok'); }catch(e){say('تعذر حفظ التقسيم');} };
 inp.onchange=commit; inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} };
 tx.append(inp); tx.notes=mk('span','notes');
 if(onReset){ const r=mk('button','x','الأصلي'); r.onclick=async()=>{ try{await onReset(); await load();}catch(e){} }; tx.notes.append(r); }
 return tx;
}
function wordLines(it,box){
 const l1=mk('div','line'); l1.append(mk('span','tx big',it.w));
 l1.append(ctl({key:it.f,path:it.f,alt:it.alt,label:it.w}));
 const parts=partsOf(it), l2=mk('div','line syl');
 const sid=it.id.replace(':','_'), tx=splitEditor(it.w,parts.map(p=>p.t),null,arr=>api('PUT','/api/split/'+sid,{word:it.w,lesson:it.id.split(':')[0],path:it.f,parts:arr}),splits[it.id]&&(()=>api('DELETE','/api/split/'+sid)));
 tx.querySelector('input').id='sp-'+it.id.replace(':','-'); if(splits[it.id]) tx.notes.append(mk('span','tag wait','التقسيم محفوظ ✓ لتحديث التطبيق قولي: طبّقي التقسيمات'));
 l2.append(tx); l2.append(ctl({key:'grp/'+it.id,path:'grp:'+it.id,alt:it.alt,label:it.w+' (مقاطع)',parts:parts.map(p=>p.f)})); l2.append(tx.notes);
 const pr=mk('div','pair'); pr.append(l1,l2); box.append(pr);
}
const cSyl=c=>splits['c:'+c.id]||c.syl;
const rmBtn=c=>{ const x=mk('button','x','إزالة'); x.onclick=async()=>{ try{await api('DELETE','/api/custom/'+c.id); await load();}catch(e){} }; return x; };
function customLine(c){
 if(c.kind==='letter'){ const f=mk('div'); const n=mk('div','line'); n.append(mk('span','lab','حرف')); n.append(mk('span','tx big',c.label+' (اسم الحرف)')); n.append(ctl({key:'c/'+c.id,path:c.path,label:'اسم الحرف '+c.label})); f.append(n);
  const sy=MARKS.map(m=>c.label+m[1]), l=mk('div','line'); l.append(mk('span','lab','الأصوات')); l.append(mk('span','tx big',sy.join('  ')));
  l.append(ctl({key:'cl/'+c.id,path:'grp:cl'+c.id,label:'أصوات الحرف '+c.label,parts:sy.map(t=>'syl-ar/'+hex(t)+'.mp3')})); f.append(l);
  if(!c.fixed&&!recs[idOf('c/'+c.id)]) n.append(rmBtn(c)); return f; }
 if(c.kind==='word'&&c.syl&&c.syl.length){ const f=mk('div'); const w=mk('div','line'); w.append(mk('span','tx big',c.label)); w.append(ctl({key:'c/'+c.id,path:c.path,label:c.label}));
  const sy=cSyl(c), m=mk('div','line syl'); const sid='c_'+c.id;
  const tx=splitEditor(c.label,sy,null,arr=>api('PUT','/api/split/'+sid,{word:c.label,custom:c.id,path:c.path,parts:arr}),splits['c:'+c.id]&&(()=>api('DELETE','/api/split/'+sid)));
  if(splits['c:'+c.id]) tx.notes.append(mk('span','tag wait','التقسيم محفوظ ✓ لتحديث التطبيق قولي: طبّقي التقسيمات')); m.append(tx);
  m.append(ctl({key:'cg/'+c.id,path:'grp:c'+c.id,label:c.label+' (مقاطع)',parts:sy.map(t=>'syl-ar/'+hex(t)+'.mp3')})); m.append(tx.notes);
  if(!c.fixed&&!recs[idOf('c/'+c.id)]&&!recs[idOf('cg/'+c.id)]) w.append(rmBtn(c));
  const pr=mk('div','pair'); pr.append(w,m); f.append(pr); return f; }
 const l=mk('div','line'); l.append(mk('span','lab',{word:'كلمة',question:'سؤال',reading:'قراءة',other:''}[c.kind]||'')); l.append(mk('span','tx big',c.label||'')); l.append(ctl({key:'c/'+c.id,path:c.path,label:c.label}));
 if(!c.fixed&&!recs[idOf('c/'+c.id)]) l.append(rmBtn(c)); return l; }
function render(){
 if(live) return;
 const act=document.activeElement&&document.activeElement.id, y=scrollY;
 const all=[...needed.map(n=>({...n,fixed:true})),...customs];
 const mine=c=>c.kind==='letter'?letterDone(c):(!!recs[idOf('c/'+c.id)]&&(!(c.syl&&c.syl.length)||(!!recs[idOf('cg/'+c.id)]&&!stale('cg/'+c.id,cSyl(c).map(t=>'syl-ar/'+hex(t)+'.mp3')))));
 const nd=$('#needed'); nd.innerHTML=''; const need=all.filter(c=>!mine(c));
 nd.append(mk('h2','','مطلوب تسجيله')); if(!need.length) nd.append(mk('div','empty','لا يوجد شيء جديد مطلوب الآن.')); need.forEach(c=>nd.append(customLine(c)));
 const SH=$('#shared'); SH.innerHTML=''; SH.append(mk('h2','','جمل مشتركة لكل الحروف'));
 SHARED.forEach(([f,t])=>{ const l=mk('div','line'); l.append(mk('span','tx',t)); l.append(ctl({key:f,path:f,label:t})); SH.append(l); });
 const L=$('#words'); L.innerHTML=''; L.append(mk('h2','','الكلمات والمقاطع'));
 items.words.filter(w=>!customs.concat(needed).some(c=>c.kind==='word'&&c.path===w.f)).forEach(w=>wordLines(w,L));   // words requested in the top list are edited there
 const P=$('#prompts'); P.innerHTML=''; P.append(mk('h2','','صوتيات الأسئلة'));
 items.prompts.forEach(p=>{ const l=mk('div','line'); l.append(mk('span','tx',p.text)); l.append(ctl({key:p.f,path:p.f,label:p.text},p.cur)); P.append(l); });
 const dn=$('#done'); dn.innerHTML=''; const dd=all.filter(mine); if(dd.length){ dn.append(mk('h2','','ما سجلته من المضاف')); dd.forEach(c=>dn.append(customLine(c))); }
 if(act){const e=document.getElementById(act); e&&e.focus&&e.focus({preventScroll:true});} scrollTo(0,y);
}
async function load(){
 const r=await api('GET','/api/list'); const d=await r.json(); if(!r.ok||d.error) throw new Error(d.error==='not-migrated'?'المكتبة تحتاج تحديث على الخادم':'خطأ من الخادم '+r.status);
 recs={}; d.rec.forEach(m=>{recs[m.id]=m;}); splits={}; d.splits.forEach(s=>{splits[String(s.id).replace('_',':')]=s.parts;});
 customs=d.custom.sort((a,b)=>(a.ts||0)-(b.ts||0)); render();
}
async function gate(why){
 document.body.classList.remove('in'); $('#gate').hidden=false; let claimed=true;
 const note=(m,k)=>{ const n=$('#pwnote'); n.textContent=m||''; n.style.color=k==='err'?'#c0392b':k==='ok'?'#1e8449':''; n.style.fontWeight=m?'700':''; n.style.fontSize=m?'17px':''; say(m,k==='err'?'':k); };
 try{ claimed=(await (await fetch('/api/state')).json()).claimed; }catch(e){}
 $('#pwbtn').textContent=claimed?'دخول':'تعيين كلمة السر';
 note(why||(claimed?'اكتبي كلمة السر لعرض المكتبة':'أول مرة: اختاري كلمة سر (4 أحرف على الأقل) واحفظيها.'),why?'err':'');
 const go=async()=>{ const v=$('#pw').value.trim(); if(!v) return note('اكتبي كلمة السر أولا','err');
  $('#pwbtn').disabled=true; note('جاري التحقق...');
  try{
   if(!claimed){ const r=await fetch('/api/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:v})}); if(!r.ok){ $('#pwbtn').disabled=false; return note('كلمة السر قصيرة (4 أحرف على الأقل) أو معيّنة من قبل','err'); } }
   const r=await fetch('/api/check',{headers:{'x-pw':v}}); if(!r.ok){ $('#pwbtn').disabled=false; return note('كلمة السر غير صحيحة ❌ حاولي مرة أخرى','err'); }
   PW=v; try{ localStorage.setItem('pw',v); }catch(e){}
  }catch(e){ $('#pwbtn').disabled=false; return note('لا يوجد اتصال بالإنترنت، حاولي مرة أخرى','err'); }
  $('#pwbtn').disabled=false; note('تم تسجيل الدخول ✓ جاري تحميل المحتوى...','ok'); await enter(); };
 $('#pwbtn').onclick=go; $('#pw').onkeydown=e=>{ if(e.key==='Enter') go(); };
}
async function enter(){
 try{ await load(); document.body.classList.add('in'); $('#gate').hidden=true; say('تم تسجيل الدخول ✓','ok'); }
 catch(e){ if(e.message==='auth') return; const n=$('#pwnote'); n.textContent='تم الدخول لكن تعذر تحميل المحتوى ('+e.message+'). اضغطي دخول للمحاولة مرة أخرى.'; n.style.color='#c0392b'; }
}
$('#addbtn').onclick=async()=>{ const t=$('#newtext').value.trim(); if(!t) return say('اكتب النص أولا');
 const kind=$('#kind').value, id='c'+Date.now().toString(36), syl=kind==='word'?sylList($('#newsyl').value):[];
 const label=kind==='letter'?[...t][0]:t, path=kind==='letter'?'arabic/letters/'+hex(label)+'/name.mp3':'arabic/inbox/'+kind+'-'+id+'.mp3';
 try{ await api('PUT','/api/custom/'+id,{label,kind,syl,path}); $('#newtext').value=''; $('#newsyl').value=''; say(''); await load(); }catch(e){say('تعذرت الإضافة');} };
const kd=()=>{ $('#newsyl').hidden=$('#kind').value!=='word'; $('#newtext').placeholder=$('#kind').value==='letter'?'اكتب الحرف (مثل أ)':'اكتب النص هنا'; }; $('#kind').onchange=kd; kd();
$('#backup').onclick=async()=>{ try{ say('جاري التجهيز...'); const r=await api('GET','/api/export'); const b=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='recordings-'+new Date().toISOString().slice(0,10)+'.json'; document.body.append(a); a.click(); a.remove(); say(''); }catch(e){say('تعذر التنزيل');} };
(async function(){
 items=await (await fetch('items.json')).json(); try{ needed=await (await fetch('needed.json?'+Date.now())).json(); }catch(e){} 
 try{ const r=PW?await fetch('/api/check',{headers:{'x-pw':PW}}):null; if(r&&r.ok) await enter(); else gate(PW?'كلمة السر المحفوظة غير صحيحة، ادخلي من جديد':''); }catch(e){ gate('لا يوجد اتصال بالإنترنت'); }
})();
</script>
