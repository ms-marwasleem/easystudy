<script>/* LOADING WATCHDOG (2026-11-07): if the first screen has not opened 12 s after the page started (an old copy of the app stuck on the device,
   a script error), a button appears on the loading screen: it drops the copy of the app kept on the device and loads it fresh. The last script
   errors are written small under it, so a screenshot tells what went wrong. */
(function(){var errs=[];addEventListener('error',function(e){errs.push((e.message||'error')+' @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||''))},true);
addEventListener('unhandledrejection',function(e){var r=e.reason;errs.push('promise: '+(r&&(r.message||r)))});
function check(){var l=document.getElementById('loading');if(!l||l.hidden||l.style.display==='none'||document.documentElement.dataset.view||document.getElementById('ldHelp'))return;   /* only while no screen has ever opened */
var d=document.createElement('div');d.id='ldHelp';d.style.cssText='position:fixed;left:50%;bottom:7%;transform:translateX(-50%);z-index:61;text-align:center;max-width:90vw';
d.innerHTML='<button type="button" style="font:800 20px system-ui,sans-serif;padding:.55em 1.4em;border-radius:2em;border:3px solid #6B2E0C;background:#fff;color:#6B2E0C;cursor:pointer">تحميل من جديد</button><p dir="ltr" style="margin:.6em 0 0;font:12px system-ui,sans-serif;color:#6B2E0C;word-break:break-all"></p>';
d.querySelector('p').textContent=errs.slice(-3).join(' | ');
d.querySelector('button').onclick=function(){var w=[];try{if(navigator.serviceWorker)w.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));
if(window.caches)w.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}))}catch(e){}
Promise.all(w).catch(function(){}).then(function(){location.reload()})};document.body.appendChild(d)}
setTimeout(check,12000)})();</script>
