<!doctype html><html lang="ar" data-theme="words"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual">
<title>Easy Words</title>
<!-- EASY WORDS: a second, separate app (own look, users, subscriptions, credits, dashboard). It uses the curriculum app's code parts, design parts and data BY REFERENCE
     (tools/build-words.py joins them), so a change to a word, its syllables, picture or sound in the curriculum data shows in both apps. -->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{background:#f3f1ec}body{margin:0;padding:0;font:14px -apple-system,sans-serif;background:#f3f1ec url(data/words/paper.jpg) center/cover fixed}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#f3f1ec url(data/words/paper.jpg) center/cover;transition:opacity .3s}
#loading .ld{display:flex;flex-direction:column;align-items:center;gap:18px}
#loading .ldt{font-family:"Luckiest Guy","Baloo Bhaijaan 2",sans-serif;font-size:46px;color:#fff;-webkit-text-stroke:9px #1d4f57;paint-order:stroke fill;text-shadow:0 3px 0 #1d4f57;line-height:1.05;text-align:center}
@keyframes ldr{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
#loading .bar{width:180px;height:16px;border-radius:999px;background:rgba(29,79,87,.25);border:3px solid #1d4f57;overflow:hidden}#loading .bar i{display:block;height:100%;width:40%;border-radius:999px;background:#2f7a86;animation:ldr 1.1s ease-in-out infinite}</style>
<script>var cssReady=new Promise(function(r){window.cssDone=r});</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@600;800&family=Luckiest+Guy&family=Noto+Naskh+Arabic:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="css/words-app.css" onload="this.onload=function(){cssDone()};this.rel='stylesheet'" onerror="cssDone()">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="js/words-app.js"></script>
<link rel="manifest" href="words.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="words-icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="words-icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f7a86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Easy Words">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head><body>
<div id="loading"><div class="ld"><b class="ldt">EASY<br>WORDS</b><b id="loadingText" hidden></b><div class="bar"><i></i></div></div></div>
<svg width="1" height="1" style="position:absolute;left:0;top:0" aria-hidden="true"><defs id="ewDefs"></defs></svg>
<canvas id="fx"></canvas>

<!-- CURRICULUM PICKER (first open; the same place later changes it) -->
<section class="screen" id="welcome" aria-label="Curriculum" hidden>
  <div class="ew-pick" id="ewPick"></div>
</section>

<!-- HOME: the subjects as icons (replaces the books of the curriculum app) -->
<section class="screen" id="subjects" aria-label="Subjects">
  <header class="top ew-top">
    <div class="ew-brand"><div class="ew-logo" id="ewHomeLogo" aria-label="Easy Words"></div><small class="ew-grade" id="ewGrade"></small></div>
    <div class="topr"><div class="hud" data-hud></div></div>
  </header>
  <div class="ew-home" id="ewHome"></div>
</section>

<!-- SUBJECT: units as files, lessons as squares, words as squares (no road, no page numbers) -->
<section class="screen" id="map" aria-label="Units" hidden>
  <header class="top ew-top">
    <div class="navbtns"><button class="rb" data-go="subjects" aria-label="Home" data-icon="home"></button><button class="rb ew-q" id="ewTestBtn" aria-label="اختبار"><span>?</span></button></div>
    <div class="topr"><div class="hud" data-hud></div></div>
    <h1 class="ew-title" id="ewMapTitle"></h1>
  </header>
  <div class="ew-scroll" id="ewMapBody"></div>
</section>

<!-- LESSON: two tabs only (words = the curriculum app's own words template, practice) -->
<section class="screen" id="lesson" hidden>
  <header class="l-head">
    <div class="navbtns">
      <button class="rb" data-go="subjects" aria-label="Home" data-icon="home"></button>
      <button class="rb" data-go="map" aria-label="Units" data-icon="back"></button>
    </div>
    <small class="ew-meta" id="lessonMeta"></small>
    <div class="sign"><h1 class="outline" id="lessonTitle"></h1></div>
    <div class="track" aria-hidden="true" hidden><div class="car" id="trackCar"></div><span class="flag"></span></div>
    <div class="hud" data-hud id="hudLesson"></div>
  </header>
  <div class="mid">
    <main class="stage" id="stage"></main>
    <nav class="rail" id="rail" aria-label="Controls"></nav>
  </div>
  <div class="foot">
    <div class="lmeta" id="lmeta"><div class="lm-l"></div><div class="lm-dots" id="lmDots" hidden></div><div class="lm-r"></div></div>
    <nav class="tabs" role="tablist">
      <button class="pill tab" role="tab" data-tab="words"></button>
      <button class="pill tab" role="tab" data-tab="practice"></button>
    </nav>
  </div>
</section>
<section class="screen" id="exam" hidden></section>

<!-- TEST BUILDER (the ? button): the parent picks units / lessons / words, how many questions, which kinds; the questions then run like the practice tab -->
<section class="screen" id="ewTest" aria-label="Test" hidden>
  <header class="top ew-top">
    <div class="navbtns"><button class="rb" id="ewTestBack" aria-label="Back" data-icon="back"></button></div>
    <h1 class="ew-title" id="ewTestTitle">اختبار</h1>
    <div class="topr"><div class="hud" data-hud></div></div>
  </header>
  <div class="ew-scroll" id="ewTestBody"></div>
</section>

<!-- REPORT: good words / words to review / weak words, tests taken -->
<section class="screen" id="ewReport" aria-label="Report" hidden>
  <header class="top ew-top">
    <div class="navbtns"><button class="rb" data-go="subjects" aria-label="Home" data-icon="home"></button></div>
    <h1 class="ew-title">تقريري</h1>
    <div class="topr"><div class="hud" data-hud></div></div>
  </header>
  <div class="ew-scroll" id="ewRepBody"></div>
</section>

<!-- END OF A PRACTICE ROUND -->
<div class="overlay" id="ewDone" hidden>
  <div class="rays"></div>
  <div class="popup ew-pop" role="dialog" aria-label="Done"></div>
</div>

<!-- LEVEL COMPLETE (the words tab, same popup as the curriculum app) -->
<div class="overlay" id="levelUp" hidden>
  <div class="rays"></div>
  <div class="popup" role="dialog" aria-label="Lesson complete">
    <h2 class="great" id="lvlTitle" data-t="Great!">Great!</h2>
    <div class="slots" id="slots"></div>
    <span class="car" id="lvlCar"></span>
    <div class="btns">
      <button class="pill blue" id="lvlAgain">Again</button>
      <button class="pill green" id="lvlMap">Map</button>
    </div>
  </div>
</div>

<div class="overlay" id="msg" hidden>
  <div class="rays"></div>
  <div class="popup" role="dialog">
    <h2 class="outline big" id="msgTitle"></h2>
    <div class="msg-art" id="msgArt"></div>
    <p class="msg-text" id="msgText"></p>
    <button class="pill green" id="msgOk">Nice!</button>
  </div>
</div>

<div class="hint" id="hint" hidden><span class="hint-text" id="hintText"></span><svg class="hint-arrow" id="hintArrow" viewBox="0 0 100 100"><path d=""/></svg></div>

</body></html>
